<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Quiz Bono Uninivel — HC Wellness</title>
  <style>
    :root{
      --hc-orange:#de7319;
      --hc-orange-dark:#a3441f;
      --ok:#0a7a2f;
      --bad:#b00020;
      --ink:#111;
      --muted:#666;
      --card:#fff;
      --bg:#f6f5f2;
      --line:#e6e6e6;
    }
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);}
    .wrap{max-width:980px;margin:22px auto;padding:0 14px;}
    .top{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 6px 18px rgba(0,0,0,.04);}
    h1{margin:0 0 6px;font-size:22px;text-align:center;color:var(--hc-orange-dark)}
    .sub{margin:0 0 12px;color:var(--muted);line-height:1.35;text-align:center}
    .rule{margin:0;padding:12px 14px;border-radius:14px;background:#fff3ea;border:1px solid #ffd3b7;font-weight:800;line-height:1.35}
    code{background:#fff;padding:1px 6px;border-radius:8px;border:1px solid #eee}
    .pill{display:inline-block;padding:2px 10px;border-radius:999px;border:1px solid #ffd3b7;background:#fff;font-size:12px;color:#222;font-weight:900;margin-top:8px}

    .q{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--hc-orange);border-radius:18px;padding:14px;margin:12px 0}
    .q-title{font-weight:900;margin:0 0 10px;line-height:1.25}
    .q-desc{margin:0 0 10px;color:var(--muted);line-height:1.35}
    .opt{display:block;padding:10px 12px;border:1px solid var(--line);border-radius:14px;margin:8px 0;background:#fff}
    .opt input{margin-right:10px;transform:translateY(1px)}
    .opt.correct{border-color:var(--ok);background:#e9f7ee}
    .opt.wrong{border-color:var(--bad);background:#fdecee}
    .fb{margin-top:8px;font-weight:900}
    .fb.ok{color:var(--ok)}
    .fb.bad{color:var(--bad)}

    .controls{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:18px;
      padding:14px;
      margin:18px 0 14px;
    }
    .controls-row{
      display:flex;
      justify-content:flex-end;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
    }
    button{cursor:pointer;border-radius:14px;padding:10px 14px;font-weight:900;border:0;line-height:1}
    .btn-review{
      background:var(--hc-orange);
      color:#fff;
      padding:14px 18px;
      border-radius:16px;
      font-size:16px;
      box-shadow:0 10px 18px rgba(222,115,25,.25);
    }
    .btn-review:hover{background:var(--hc-orange-dark)}
    .btn-white{
      background:#fff;
      color:var(--hc-orange-dark);
      border:1px solid var(--hc-orange-dark);
      padding:12px 14px;
      border-radius:16px;
      font-size:14px;
    }
    .btn-white:hover{
      background:#fff7f1;
      border-color:var(--hc-orange);
      color:var(--hc-orange);
    }

    .score-wrap{
      background:linear-gradient(90deg, #fff3ea, #ffffff);
      border:1px solid #ffd3b7;
      border-radius:18px;
      padding:14px;
      margin:12px 0 26px;
      text-align:center;
    }
    .score-title{
      font-weight:900;
      color:var(--hc-orange-dark);
      margin:0 0 6px;
      font-size:16px;
    }
    .score{
      font-weight:1000;
      font-size:28px;
      letter-spacing:.3px;
      margin:0;
    }
    .foot{color:var(--muted);font-size:12.5px;margin:10px 0 26px;text-align:center}

    .floating-back{
      position:fixed;
      right:16px;
      bottom:16px;
      z-index:9999;
      background:#000;
      color:#fff;
      text-decoration:none;
      font-weight:900;
      padding:10px 14px;
      border-radius:999px;
      box-shadow:0 10px 20px rgba(0,0,0,.25);
      border:1px solid rgba(255,255,255,.15);
    }
    .floating-back:hover{opacity:.92}
  </style>
</head>
<body>
  <a class="floating-back" href="https://emiliorxzz-huyaz.wordpress.com/5-plan-de-compensacion/">Volver a HCW Zone</a>

  <div class="wrap">
    <div class="top">
      <h1>Quiz Bono Uninivel</h1>
      <p class="sub">Cada intento genera <b>10 preguntas</b>. Responde y presiona <b>Revisar</b>.</p>
      <p class="rule">
        Regla base:<br>
        • Uninivel paga <code>5%</code> en niveles 1 al 6 sobre el <b>CV aplicable</b>.<br>
        <div class="pill">Tip: total = suma de (CV de cada nivel × 5%).</div>
      </p>
    </div>

    <div id="quiz"></div>

    <div class="controls">
      <div class="controls-row">
        <button class="btn-review" id="btnCheck" type="button">Revisar</button>
        <button class="btn-white" id="btnNew" type="button">Nueva versión</button>
        <button class="btn-white" id="btnReset" type="button">Limpiar</button>
      </div>
    </div>

    <div class="score-wrap">
      <p class="score-title">Resultado</p>
      <p class="score" id="score">—</p>
    </div>

    <div class="foot">HC Wellness Zone • Quiz Uninivel</div>
  </div>

<script>
  const shuffle = (arr) => {
    const a = arr.slice();
    for (let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
  };
  const pickN = (arr,n) => shuffle(arr).slice(0,n);

  const to2 = (n) => (Math.round(n*100)/100).toFixed(2).replace(/\.00$/,'');
  const usd = (n) => `${to2(n)} USD`;
  const rate = 0.05;

  function calcTotal(levels){
    // levels: array of {lvl:1..6, cv:number}
    return levels.reduce((sum,x)=>sum + (x.cv * rate), 0);
  }

  // Banco de escenarios (se mezclan y se toman 10)
  // Nota: no decimos "nivel X" como sección; se incluye dentro del texto.
  const BANK = [
    {id:"u1", text:"En tu nivel 1 se generaron 400 CV. ¿Cuánto ganas de Bono Uninivel (USD) por ese nivel?", levels:[{lvl:1,cv:400}]},
    {id:"u2", text:"En tu nivel 2 se generaron 1,200 CV. ¿Cuánto ganas de Bono Uninivel (USD) por ese nivel?", levels:[{lvl:2,cv:1200}]},
    {id:"u3", text:"En tu nivel 3 se generaron 2,500 CV. ¿Cuánto ganas de Bono Uninivel (USD) por ese nivel?", levels:[{lvl:3,cv:2500}]},
    {id:"u4", text:"En tu nivel 4 se generaron 5,000 CV. ¿Cuánto ganas de Bono Uninivel (USD) por ese nivel?", levels:[{lvl:4,cv:5000}]},
    {id:"u5", text:"En tu nivel 5 se generaron 8,000 CV. ¿Cuánto ganas de Bono Uninivel (USD) por ese nivel?", levels:[{lvl:5,cv:8000}]},
    {id:"u6", text:"En tu nivel 6 se generaron 10,000 CV. ¿Cuánto ganas de Bono Uninivel (USD) por ese nivel?", levels:[{lvl:6,cv:10000}]},

    {id:"u7", text:"Tienes estos CV: Nivel 1 = 600 CV y Nivel 2 = 1,000 CV. ¿Cuánto ganas de Bono Uninivel total (USD)?", levels:[{lvl:1,cv:600},{lvl:2,cv:1000}]},
    {id:"u8", text:"Tienes estos CV: Nivel 1 = 400 CV, Nivel 3 = 2,000 CV y Nivel 6 = 1,200 CV. ¿Cuánto ganas de Bono Uninivel total (USD)?", levels:[{lvl:1,cv:400},{lvl:3,cv:2000},{lvl:6,cv:1200}]},
    {id:"u9", text:"Tienes estos CV: Nivel 2 = 1,500 CV, Nivel 4 = 3,000 CV y Nivel 5 = 2,500 CV. ¿Cuánto ganas de Bono Uninivel total (USD)?", levels:[{lvl:2,cv:1500},{lvl:4,cv:3000},{lvl:5,cv:2500}]},
    {id:"u10", text:"Tienes estos CV: Nivel 1 = 800 CV, Nivel 2 = 700 CV, Nivel 3 = 600 CV. ¿Cuánto ganas de Bono Uninivel total (USD)?", levels:[{lvl:1,cv:800},{lvl:2,cv:700},{lvl:3,cv:600}]},
    {id:"u11", text:"Tienes estos CV: Nivel 1 = 1,000 CV, Nivel 2 = 1,000 CV, Nivel 3 = 1,000 CV, Nivel 4 = 1,000 CV. ¿Cuánto ganas de Bono Uninivel total (USD)?", levels:[{lvl:1,cv:1000},{lvl:2,cv:1000},{lvl:3,cv:1000},{lvl:4,cv:1000}]},
    {id:"u12", text:"Tienes estos CV: Nivel 1 = 2,000 CV, Nivel 2 = 1,500 CV, Nivel 3 = 1,000 CV, Nivel 4 = 500 CV, Nivel 5 = 300 CV, Nivel 6 = 200 CV. ¿Cuánto ganas de Bono Uninivel total (USD)?", levels:[{lvl:1,cv:2000},{lvl:2,cv:1500},{lvl:3,cv:1000},{lvl:4,cv:500},{lvl:5,cv:300},{lvl:6,cv:200}]},

    {id:"u13", text:"En tu nivel 1 se generaron 3,500 CV. ¿Cuánto ganas de Bono Uninivel (USD) por ese nivel?", levels:[{lvl:1,cv:3500}]},
    {id:"u14", text:"En tu nivel 2 se generaron 4,250 CV. ¿Cuánto ganas de Bono Uninivel (USD) por ese nivel?", levels:[{lvl:2,cv:4250}]},
    {id:"u15", text:"Tienes estos CV: Nivel 3 = 3,000 CV y Nivel 6 = 2,000 CV. ¿Cuánto ganas de Bono Uninivel total (USD)?", levels:[{lvl:3,cv:3000},{lvl:6,cv:2000}]},
    {id:"u16", text:"Tienes estos CV: Nivel 4 = 6,000 CV, Nivel 5 = 2,000 CV y Nivel 6 = 2,000 CV. ¿Cuánto ganas de Bono Uninivel total (USD)?", levels:[{lvl:4,cv:6000},{lvl:5,cv:2000},{lvl:6,cv:2000}]},
    {id:"u17", text:"Tienes estos CV: Nivel 1 = 500 CV, Nivel 2 = 2,500 CV, Nivel 3 = 1,500 CV y Nivel 6 = 500 CV. ¿Cuánto ganas de Bono Uninivel total (USD)?", levels:[{lvl:1,cv:500},{lvl:2,cv:2500},{lvl:3,cv:1500},{lvl:6,cv:500}]},
    {id:"u18", text:"En tu nivel 6 se generaron 22,000 CV. ¿Cuánto ganas de Bono Uninivel (USD) por ese nivel?", levels:[{lvl:6,cv:22000}]},
  ];

  function explain(levels, total){
    const parts = levels.map(x => `Nivel ${x.lvl}: ${x.cv} × 5% = ${to2(x.cv*rate)}`).join(" | ");
    return `${parts}. Total = ${usd(total)}.`;
  }

  function make3Options(correct){
    const c = Number(correct);
    const w1 = c * 0.8;   // error: usar 4% en vez de 5% aprox
    const w2 = c * 1.2;   // error: usar 6% en vez de 5% aprox
    let opts = [c, w1, w2].map(v => Number(to2(v)));
    if(new Set(opts).size < 3){
      opts = [c, c*0.9, c*1.1].map(v => Number(to2(v)));
    }
    return shuffle(opts).map(v => ({
      label: usd(v),
      value: String(to2(v)),
      isCorrect: Math.abs(v - Number(to2(c))) < 0.001
    }));
  }

  let current = [];

  function render(){
    const host = document.getElementById("quiz");
    host.innerHTML = "";
    document.getElementById("score").textContent = "—";

    current = pickN(BANK, 10).map(item => {
      const correct = calcTotal(item.levels);
      const correctValue = String(to2(correct));
      const options = make3Options(correct);
      return {...item, correct, correctValue, options};
    });

    current.forEach((q, i) => {
      const card = document.createElement("div");
      card.className = "q";
      card.innerHTML = `
        <div class="q-title">P${i+1}. ${q.text}</div>
        <div class="q-desc">Selecciona la respuesta correcta.</div>
        <div class="opts">
          ${q.options.map(opt => `
            <label class="opt">
              <input type="radio" name="${q.id}" value="${opt.value}">
              ${opt.label}
            </label>
          `).join("")}
        </div>
        <div class="fb" id="fb-${q.id}"></div>
      `;
      host.appendChild(card);
    });
  }

  function check(){
    let ok = 0, total = 0;

    current.forEach(q => {
      total++;
      const picked = document.querySelector(`input[name="${q.id}"]:checked`);
      const inputs = document.querySelectorAll(`input[name="${q.id}"]`);
      const fb = document.getElementById(`fb-${q.id}`);

      inputs.forEach(inp => inp.closest(".opt").classList.remove("correct","wrong"));

      if(!picked){
        fb.className = "fb bad";
        fb.textContent = "Elige una opción.";
        return;
      }

      inputs.forEach(inp => {
        const lab = inp.closest(".opt");
        const isCorrect = String(inp.value) === String(q.correctValue);
        if(isCorrect) lab.classList.add("correct");
        if(inp.checked && !isCorrect) lab.classList.add("wrong");
      });

      const isOk = String(picked.value) === String(q.correctValue);
      if(isOk){
        ok++;
        fb.className = "fb ok";
        fb.textContent = "Correcto ✅";
      } else {
        fb.className = "fb bad";
        fb.textContent = `Incorrecto ❌  ${explain(q.levels, q.correct)}`;
      }
    });

    document.getElementById("score").textContent = `${ok}/${total}`;
  }

  function reset(){
    current.forEach(q=>{
      document.querySelectorAll(`input[name="${q.id}"]`).forEach(inp => inp.checked=false);
      document.querySelectorAll(`input[name="${q.id}"]`).forEach(inp => inp.closest(".opt").classList.remove("correct","wrong"));
      const fb = document.getElementById(`fb-${q.id}`);
      if(fb){ fb.className="fb"; fb.textContent=""; }
    });
    document.getElementById("score").textContent = "—";
  }

  document.getElementById("btnNew").addEventListener("click", render);
  document.getElementById("btnCheck").addEventListener("click", check);
  document.getElementById("btnReset").addEventListener("click", reset);

  render();
</script>
</body>
</html>
