<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Quiz Programa de Lealtad (LRP) — HC Wellness</title>
  <style>
    :root{
      --hc-orange:#de7319;
      --hc-orange-dark:#a3441f;
      --ok:#0a7a2f;
      --bad:#b00020;
      --ink:#111;
      --muted:#666;
      --card:#fff;
      --bg:#f6f5f2;
      --line:#e6e6e6;
    }
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);}
    .wrap{max-width:980px;margin:22px auto;padding:0 14px;}
    .top{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 6px 18px rgba(0,0,0,.04);}
    h1{margin:0 0 6px;font-size:22px;text-align:center;color:var(--hc-orange-dark)}
    .sub{margin:0 0 12px;color:var(--muted);line-height:1.35;text-align:center}
    .rule{margin:0;padding:12px 14px;border-radius:14px;background:#fff3ea;border:1px solid #ffd3b7;font-weight:800;line-height:1.35}
    code{background:#fff;padding:1px 6px;border-radius:8px;border:1px solid #eee}
    .pill{display:inline-block;padding:2px 10px;border-radius:999px;border:1px solid #ffd3b7;background:#fff;font-size:12px;color:#222;font-weight:900;margin-top:8px}

    .q{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--hc-orange);border-radius:18px;padding:14px;margin:12px 0}
    .q-title{font-weight:900;margin:0 0 10px;line-height:1.25}
    .q-desc{margin:0 0 10px;color:var(--muted);line-height:1.35}
    .opt{display:block;padding:10px 12px;border:1px solid var(--line);border-radius:14px;margin:8px 0;background:#fff}
    .opt input{margin-right:10px;transform:translateY(1px)}
    .opt.correct{border-color:var(--ok);background:#e9f7ee}
    .opt.wrong{border-color:var(--bad);background:#fdecee}
    .fb{margin-top:8px;font-weight:900}
    .fb.ok{color:var(--ok)}
    .fb.bad{color:var(--bad)}

    .controls{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:18px;
      padding:14px;
      margin:18px 0 14px;
    }
    .controls-row{
      display:flex;
      justify-content:flex-end;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
    }
    button{cursor:pointer;border-radius:14px;padding:10px 14px;font-weight:900;border:0;line-height:1}
    .btn-review{
      background:var(--hc-orange);
      color:#fff;
      padding:14px 18px;
      border-radius:16px;
      font-size:16px;
      box-shadow:0 10px 18px rgba(222,115,25,.25);
    }
    .btn-review:hover{background:var(--hc-orange-dark)}
    .btn-white{
      background:#fff;
      color:var(--hc-orange-dark);
      border:1px solid var(--hc-orange-dark);
      padding:12px 14px;
      border-radius:16px;
      font-size:14px;
    }
    .btn-white:hover{
      background:#fff7f1;
      border-color:var(--hc-orange);
      color:var(--hc-orange);
    }

    .score-wrap{
      background:linear-gradient(90deg, #fff3ea, #ffffff);
      border:1px solid #ffd3b7;
      border-radius:18px;
      padding:14px;
      margin:12px 0 26px;
      text-align:center;
    }
    .score-title{
      font-weight:900;
      color:var(--hc-orange-dark);
      margin:0 0 6px;
      font-size:16px;
    }
    .score{
      font-weight:1000;
      font-size:28px;
      letter-spacing:.3px;
      margin:0;
    }
    .foot{color:var(--muted);font-size:12.5px;margin:10px 0 26px;text-align:center}

    .floating-back{
      position:fixed;
      right:16px;
      bottom:16px;
      z-index:9999;
      background:#000;
      color:#fff;
      text-decoration:none;
      font-weight:900;
      padding:10px 14px;
      border-radius:999px;
      box-shadow:0 10px 20px rgba(0,0,0,.25);
      border:1px solid rgba(255,255,255,.15);
    }
    .floating-back:hover{opacity:.92}
  </style>
</head>
<body>
  <!-- CAMBIA ESTE LINK SI QUIERES QUE REGRESE A OTRA PÁGINA -->
  <a class="floating-back" href="https://emiliorxzz-huyaz.wordpress.com/5-plan-de-compensacion/">Volver a HCW Zone</a>

  <div class="wrap">
    <div class="top">
      <h1>Quiz Programa de Lealtad (LRP)</h1>
      <p class="sub">Cada intento genera <b>10 preguntas</b>. Responde y presiona <b>Revisar</b>.</p>
      <p class="rule">
        Regla LRP:<br>
        • Orden personal: <code>LRP = CV × 10%</code><br>
        • Orden de directos: <code>LRP = CV × 5%</code>
        <div class="pill">Tip: suma LRP de personal + LRP de directos.</div>
      </p>
    </div>

    <div id="quiz"></div>

    <div class="controls">
      <div class="controls-row">
        <button class="btn-review" id="btnCheck" type="button">Revisar</button>
        <button class="btn-white" id="btnNew" type="button">Nueva versión</button>
        <button class="btn-white" id="btnReset" type="button">Limpiar</button>
      </div>
    </div>

    <div class="score-wrap">
      <p class="score-title">Resultado</p>
      <p class="score" id="score">—</p>
    </div>

    <div class="foot">HC Wellness Zone • Quiz LRP</div>
  </div>

<script>
  const shuffle = (arr) => {
    const a = arr.slice();
    for (let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
  };
  const pickN = (arr,n) => shuffle(arr).slice(0,n);

  const to2 = (n) => (Math.round(n*100)/100).toFixed(2).replace(/\.00$/,'');
  const money = (n) => `${to2(n)} LRP`;

  // Calcula LRP
  const lrpPersonal = (cv) => cv * 0.10;
  const lrpDirecto  = (cv) => cv * 0.05;

  // Banco de preguntas (se mezclan y cada intento toma 10)
  // Nota: TODAS tienen 3 opciones: 1 correcta + 2 incorrectas
  const BANK = [
    // Personal
    {id:"p1",  text:"Tu orden personal tiene 50 CV. ¿Cuántos LRP generas por tu orden personal?", correct: lrpPersonal(50)},
    {id:"p2",  text:"Tu orden personal tiene 70 CV. ¿Cuántos LRP generas por tu orden personal?", correct: lrpPersonal(70)},
    {id:"p3",  text:"Tu orden personal tiene 100 CV. ¿Cuántos LRP generas por tu orden personal?", correct: lrpPersonal(100)},
    {id:"p4",  text:"Tu orden personal tiene 225 CV. ¿Cuántos LRP generas por tu orden personal?", correct: lrpPersonal(225)},
    {id:"p5",  text:"Tu orden personal tiene 450 CV. ¿Cuántos LRP generas por tu orden personal?", correct: lrpPersonal(450)},

    // Directos (una orden)
    {id:"d1",  text:"Un directo hizo una compra de 40 CV. ¿Cuántos LRP te genera esa orden de tu directo?", correct: lrpDirecto(40)},
    {id:"d2",  text:"Un directo hizo una compra de 50 CV. ¿Cuántos LRP te genera esa orden de tu directo?", correct: lrpDirecto(50)},
    {id:"d3",  text:"Un directo hizo una compra de 70 CV. ¿Cuántos LRP te genera esa orden de tu directo?", correct: lrpDirecto(70)},
    {id:"d4",  text:"Un directo hizo una compra de 225 CV. ¿Cuántos LRP te genera esa orden de tu directo?", correct: lrpDirecto(225)},
    {id:"d5",  text:"Un directo hizo una compra de 450 CV. ¿Cuántos LRP te genera esa orden de tu directo?", correct: lrpDirecto(450)},

    // Mixto (personal + directos)
    {id:"m1",  text:"Tu orden personal es 100 CV y tienes 4 directos con compras de 70, 70, 50 y 50 CV. ¿Cuánto LRP total generas?", correct: lrpPersonal(100)+lrpDirecto(70)+lrpDirecto(70)+lrpDirecto(50)+lrpDirecto(50)},
    {id:"m2",  text:"Tu orden personal es 40 CV y tienes 5 directos con compras de 40 CV cada uno. ¿Cuánto LRP total generas?", correct: lrpPersonal(40)+5*lrpDirecto(40)},
    {id:"m3",  text:"Sin orden personal, tienes 4 directos con compras de 50 CV cada uno. ¿Cuánto LRP total generas?", correct: 4*lrpDirecto(50)},
    {id:"m4",  text:"Tu orden personal es 70 CV y tienes 2 directos con compras de 225 CV y 50 CV. ¿Cuánto LRP total generas?", correct: lrpPersonal(70)+lrpDirecto(225)+lrpDirecto(50)},
    {id:"m5",  text:"Tu orden personal es 225 CV y tienes 3 directos con compras de 40, 70 y 100 CV. ¿Cuánto LRP total generas?", correct: lrpPersonal(225)+lrpDirecto(40)+lrpDirecto(70)+lrpDirecto(100)}
  ];

  // Genera 2 distractores “creíbles”
  function make3Options(correct){
    const c = Number(correct);
    // distractores: uno con % equivocado y otro con suma equivocada
    const w1 = c * 2;             // típico error (doblar)
    const w2 = Math.max(0, c - (c*0.25)); // típico error (restar)
    let opts = shuffle([c, w1, w2]).map(v => ({
      label: money(v),
      value: String(to2(v)),
      isCorrect: Math.abs(v - c) < 0.001
    }));
    // asegura que la correcta esté y haya 3 únicas
    // (si por casualidad coinciden, ajusta)
    const uniq = new Set(opts.map(o=>o.value));
    if(uniq.size < 3){
      const w3 = c + (c*0.10);
      opts = shuffle([c, w1, w3]).map(v => ({
        label: money(v),
        value: String(to2(v)),
        isCorrect: Math.abs(v - c) < 0.001
      }));
    }
    return shuffle(opts);
  }

  let current = [];

  function render(){
    const host = document.getElementById("quiz");
    host.innerHTML = "";
    document.getElementById("score").textContent = "—";

    current = pickN(BANK, 10).map(q => {
      const correctValue = String(to2(q.correct));
      const options = make3Options(q.correct).map(o => ({...o}));
      return {...q, options, correctValue};
    });

    current.forEach((q, i) => {
      const card = document.createElement("div");
      card.className = "q";
      card.innerHTML = `
        <div class="q-title">P${i+1}. ${q.text}</div>
        <div class="q-desc">Selecciona la respuesta correcta.</div>
        <div class="opts">
          ${q.options.map(opt => `
            <label class="opt">
              <input type="radio" name="${q.id}" value="${opt.value}">
              ${opt.label}
            </label>
          `).join("")}
        </div>
        <div class="fb" id="fb-${q.id}"></div>
      `;
      host.appendChild(card);
    });
  }

  function check(){
    let ok = 0, total = 0;

    current.forEach(q => {
      total++;
      const picked = document.querySelector(`input[name="${q.id}"]:checked`);
      const inputs = document.querySelectorAll(`input[name="${q.id}"]`);
      const fb = document.getElementById(`fb-${q.id}`);

      inputs.forEach(inp => inp.closest(".opt").classList.remove("correct","wrong"));

      if(!picked){
        fb.className = "fb bad";
        fb.textContent = "Elige una opción.";
        return;
      }

      inputs.forEach(inp => {
        const lab = inp.closest(".opt");
        const isCorrect = String(inp.value) === String(q.correctValue);
        if(isCorrect) lab.classList.add("correct");
        if(inp.checked && !isCorrect) lab.classList.add("wrong");
      });

      const isOk = String(picked.value) === String(q.correctValue);
      if(isOk){
        ok++;
        fb.className = "fb ok";
        fb.textContent = "Correcto ✅";
      } else {
        fb.className = "fb bad";
        fb.textContent = `Incorrecto ❌  Correcto: ${money(Number(q.correctValue))}`;
      }
    });

    document.getElementById("score").textContent = `${ok}/${total}`;
  }

  function reset(){
    current.forEach(q=>{
      document.querySelectorAll(`input[name="${q.id}"]`).forEach(inp => inp.checked=false);
      document.querySelectorAll(`input[name="${q.id}"]`).forEach(inp => inp.closest(".opt").classList.remove("correct","wrong"));
      const fb = document.getElementById(`fb-${q.id}`);
      if(fb){ fb.className="fb"; fb.textContent=""; }
    });
    document.getElementById("score").textContent = "—";
  }

  document.getElementById("btnNew").addEventListener("click", render);
  document.getElementById("btnCheck").addEventListener("click", check);
  document.getElementById("btnReset").addEventListener("click", reset);

  render();
</script>
</body>
</html>
